<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - InformaVet</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#f59e0b">
    <link rel="icon" type="image/png" href="../recursos/iconos/icon-192.png">
    <link rel="apple-touch-icon" href="../recursos/iconos/apple-touch-icon.png">
    <link rel="stylesheet" href="../css/registro.css">
    <style>
        .mensaje-registro {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .mensaje-registro.error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            display: block;
        }
        .mensaje-registro.exito {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
            display: block;
        }
        .btn-registrar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <!-- BARRA DE NAVEGACION -->
    <header>
        <nav class="navbar">
            <a href="../" class="logo">InformaVet</a>

            <div class="nav-links">
                <a href="../">Inicio</a>
                <a href="../#categorias">Cuidados</a>
                <a href="../#beneficios">Nuestros Servicios</a>
                <a href="../#contacto">Contacto</a>
            </div>

            <div class="nav-cuenta">
                <a href="login.html" class="btn-login">Iniciar Sesión</a>
            </div>
        </nav>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <main class="contenedor-registro">
        <div class="tarjeta-registro">

            <h1>Crear una cuenta</h1>

            <p class="descripcion">
                Únete a InformaVet y comienza a conocer
                más sobre el cuidado de tus mascotas.
            </p>

            <form id="formulario-registro" novalidate>

                <!-- NOMBRE -->
                <div class="grupo-input">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- RUT -->
                <div class="grupo-input">
                    <label for="rut">RUT</label>
                    <input
                        type="text"
                        id="rut"
                        name="rut"
                        placeholder="Ej: 12345678-9"
                        required
                    >
                </div>

                <!-- CORREO -->
                <div class="grupo-input">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- CONTRASEÑA -->
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="grupo-input">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p id="mensaje-registro" class="mensaje-registro" role="alert" aria-live="polite"></p>

                <!-- BOTON REGISTRARSE -->
                <button type="submit" class="btn-registrar" id="btn-registrar">
                    Crear mi cuenta
                </button>

            </form>

            <p class="texto-login">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>

        </div>
    </main>

    <!-- Supabase SDK + cliente compartido + módulo de auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/configuracion/cliente-supabase.js"></script>
    <script src="../js/auth/autenticacion.js"></script>
    <script>
        // Si ya tiene sesión activa, ir al inicio
        redirigirSiAutenticado('../')

        const formulario = document.getElementById('formulario-registro')
        const mensaje    = document.getElementById('mensaje-registro')
        const boton      = document.getElementById('btn-registrar')

        const ERRORES = {
            'User already registered':          'Ya existe una cuenta con ese correo electrónico.',
            'Password should be at least 6 characters': 'La contraseña debe tener al menos 6 caracteres.',
            'Unable to validate email address: invalid format': 'El formato del correo no es válido.',
            'Database error saving new user': 'No pudimos crear la cuenta. Es posible que el RUT o el correo ya estén registrados.',
        }

        formulario.addEventListener('submit', async function (e) {
            e.preventDefault()

            const nombre    = document.getElementById('nombre').value.trim()
            const rut       = document.getElementById('rut').value.trim()
            const correo    = document.getElementById('correo').value.trim()
            const password  = document.getElementById('password').value
            const confirmar = document.getElementById('confirmar').value

            // Validaciones locales
            if (!nombre || !rut || !correo || !password || !confirmar) {
                mostrarMensaje('Completa todos los campos.', 'error')
                return
            }
            if (password !== confirmar) {
                mostrarMensaje('Las contraseñas no coinciden.', 'error')
                return
            }
            if (password.length < 8) {
                mostrarMensaje('La contraseña debe tener al menos 8 caracteres.', 'error')
                return
            }

            boton.disabled    = true
            boton.textContent = 'Creando cuenta…'
            ocultarMensaje()

            const { data, error } = await registrar(nombre, rut, correo, password)

            if (error) {
                mostrarMensaje(ERRORES[error.message] || error.message, 'error')
                boton.disabled    = false
                boton.textContent = 'Crear mi cuenta'
                return
            }

            // Supabase puede requerir confirmación de correo según la configuración del proyecto.
            // Si identities está vacío, el correo ya existía pero sin confirmar.
            const necesitaConfirmar = data?.user?.identities?.length === 0
            if (necesitaConfirmar) {
                mostrarMensaje('Ya existe una cuenta con ese correo. Revisa tu bandeja de entrada para confirmarla.', 'error')
                boton.disabled    = false
                boton.textContent = 'Crear mi cuenta'
                return
            }

            mostrarMensaje('¡Cuenta creada! Revisa tu correo en la parte de SPAM para confirmar tu cuenta y luego inicia sesión.', 'exito')
            boton.disabled    = true
            boton.textContent = 'Cuenta creada'

            // Si la confirmación de email está desactivada en Supabase, redirigir directamente
            if (data?.session) {
                setTimeout(() => { window.location.href = '../' }, 2000)
            }
        })

        function mostrarMensaje(texto, tipo) {
            mensaje.textContent = texto
            mensaje.className   = 'mensaje-registro ' + tipo
        }
        function ocultarMensaje() {
            mensaje.textContent = ''
            mensaje.className   = 'mensaje-registro'
        }
    </script>

    <script src="../js/pwa.js"></script>
</body>
</html>
