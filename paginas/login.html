<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - InformaVet</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#f59e0b">
    <link rel="icon"
      type="image/x-icon"
      href="../recursos/iconos/favicon_informavet.ico?v=6">
    <link rel="apple-touch-icon" href="../recursos/iconos/apple-touch-icon.png">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/navegacion.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        .mensaje-auth {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
        .mensaje-auth.error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            display: block;
        }
        .mensaje-auth.exito {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
            display: block;
        }
        .btn-ingresar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->

    <header>

        <nav class="navbar">

            <a href="../" class="logo">

                <img src="../recursos/iconos/logo_informavet_optimizado.png"
                    class="logo-icono"
                    alt="">

                <span>InformaVet</span>

            </a>

            <div class="nav-links">

                <a href="../">Inicio</a>

                <a href="filtros.html">Cuidados</a>

                <a href="identificador.html">
                    Identificador IA
                </a>

                <a href="nosotros.html">Sobre nosotros</a>

                <a href="login.html">Mis mascotas</a>

            </div>

            <div class="nav-cuenta">

                <a href="login.html" class="btn-login">
                    Iniciar Sesión
                </a>

            </div>

        </nav>

    </header>

    <main class="contenedor-principal">
        <div class="tarjeta-login">
            <h2>Portal Veterinario</h2>
            <p>Ingresa para gestionar la salud de tus mascotas.</p>

            <form id="form-login" class="formulario-visual" novalidate>
                <div class="grupo-input">
                    <label for="usuario">RUT o Correo</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ej: 12345678-9 o tu@correo.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="********"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="mensaje-login" class="mensaje-auth" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn-ingresar" id="btn-login">
                    Ingresar a mi cuenta
                </button>
            </form>

            <p class="texto-registro">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <!-- Supabase SDK + cliente compartido + módulo de auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/configuracion/cliente-supabase.js"></script>
    <script src="../js/servicios/funciones.js"></script>
    <script src="../js/auth/autenticacion.js"></script>
    <script>
        // Si ya hay sesión activa, no tiene sentido mostrar el login
        const destinoLogin =
            new URLSearchParams(window.location.search)
                .get("destino") === "identificador"
            ? "identificador.html"
            : "../";

        redirigirSiAutenticado(destinoLogin);

        const form    = document.getElementById('form-login')
        const mensaje = document.getElementById('mensaje-login')
        const boton   = document.getElementById('btn-login')

        // Mensajes de error más amigables
        const ERRORES = {
            'Invalid login credentials':  'RUT/correo o contraseña incorrectos.',
            'Email not confirmed':         'Debes confirmar tu correo antes de ingresar. Revisa tu bandeja de entrada.',
            'Too many requests':           'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.',
            'User is banned':              'Tu cuenta fue desactivada. Contacta al equipo de InformaVet.',
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault()

            const rutOCorreo = document.getElementById('usuario').value.trim()
            const password   = document.getElementById('password').value

            if (!rutOCorreo || !password) {
                mostrarMensaje('Completa todos los campos.', 'error')
                return
            }

            boton.disabled    = true
            boton.textContent = 'Ingresando…'
            ocultarMensaje()

            const { data, error } = await iniciarSesion(rutOCorreo, password)

            if (error) {
                mostrarMensaje(ERRORES[error.message] || error.message, 'error')
                boton.disabled    = false
                boton.textContent = 'Ingresar a mi cuenta'
                return
            }

            mostrarMensaje('¡Bienvenido! Redirigiendo…', 'exito')
            setTimeout(() => {

                window.location.href = destinoLogin;

            }, 1000);
        })

        function mostrarMensaje(texto, tipo) {
            mensaje.textContent = texto
            mensaje.className   = 'mensaje-auth ' + tipo
        }
        function ocultarMensaje() {
            mensaje.textContent = ''
            mensaje.className   = 'mensaje-auth'
        }
    </script>
    <script src="../js/pwa.js"></script>
    <script src="../js/interfaz-movil.js"></script>
</body>
</html>
