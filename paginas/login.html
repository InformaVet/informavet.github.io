<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinaria - Inicio</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <nav>
        <div class="botones-nav">
            <div class="nav-Inf">
                <a href="../" class="enlace-inicio">Inicio</a>
                <a href="../#beneficios" class="enlace-inicio">Nuestros Servicios</a>
                <a href="../#contacto" class="enlace-inicio">Contacto</a>
            </div>
            <div class="nav-Registro">
                <button>Iniciar Sesión</button>
                <button>Registrarse</button>
            </div>
        </div>
    </nav>

    <main class="contenedor-principal">
        <div class="tarjeta-login">
            <h2>Portal Veterinario</h2>
            <p>Ingresa para gestionar la salud de tus mascotas.</p>
            
            <form action="#" class="formulario-visual">
                <div class="grupo-input">
                    <label for="usuario">RUT o Correo</label>
                    <input type="text" id="usuario" placeholder="Ej: 12345678-9">
                </div>
                
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********">
                </div>
                
                <button type="button" class="btn-ingresar">Ingresar a mi cuenta</button>
            </form>
            
            <p class="texto-registro">¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
        </div>
    </main>
</body>
</html>
