<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>Sin conexión - InformaVet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #fff4cc;
            color: #333;
            text-align: center;
        }
        main {
            max-width: 420px;
            background: white;
            padding: 36px 28px;
            border: 2px solid #ff9a2d;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        h1 { color: #d97706; font-size: 26px; margin-bottom: 12px; }
        p { color: #665849; margin-bottom: 22px; line-height: 1.5; }
        button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #d97706; }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con InformaVet. Revisa tu conexión a internet e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
